<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickers Shop (Firebase Online)</title><style>
body {font-family: Arial; margin:0; background:#f5f5f5;}
header {background:black; color:white; padding:15px; text-align:center; font-size:22px;}
.cart {position:fixed; top:15px; right:15px; background:red; color:white; padding:10px; border-radius:50%; cursor:pointer;}
.products {display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:15px; padding:15px;}
.card {background:white; padding:10px; border-radius:10px; text-align:center;}
.card img {width:100%; border-radius:10px;}
button {background:black; color:white; padding:8px; border:none; margin:5px; cursor:pointer;}

.adminPanel {padding:15px; background:#fff; margin:15px; border-radius:10px;}
input {width:100%; padding:8px; margin:5px 0;}
</style></head>
<body><header>🔥 Stickers Shop LIVE</header>
<div class="cart" onclick="openCart()">🛒 <span id="cartCount">0</span></div><div class="products" id="products"></div><div class="adminPanel">
<h3>Admin Add Product</h3>
<input id="img" placeholder="Image URL">
<input id="name" placeholder="Name">
<input id="price" placeholder="Price">
<button onclick="addProduct()">Add Product</button>
</div><!-- FIREBASE SDK --><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script><script>

// 🔥 FIREBASE CONFIG (YAHAN APNA PROJECT DALNA HAI)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let cart = [];

function addProduct(){
  let img=document.getElementById("img").value;
  let name=document.getElementById("name").value;
  let price=document.getElementById("price").value;

  if(!img||!name||!price){alert("Fill all");return;}

  let newProduct = {img,name,price};

  db.ref("products").push(newProduct);

  alert("Product added online!");
}

function loadProducts(){
  db.ref("products").on("value", (snap)=>{
    let data = snap.val();
    let html="";

    for(let id in data){
      html += `
      <div class='card'>
        <img src='${data[id].img}'>
        <p>${data[id].name}</p>
        <p>₹${data[id].price}</p>
        <button onclick="buyNow('${data[id].name}','${data[id].price}')">Buy Now</button>
      </div>`;
    }

    document.getElementById("products").innerHTML = html;
  });
}

function buyNow(name,price){
  let msg = `Hi, I want to order ${name} (₹${price})`;
  window.open("https://wa.me/919455104193?text="+encodeURIComponent(msg));
}

function openCart(){
  alert("Cart system Firebase upgrade next step me add kar sakte hain");
}

loadProducts();

</script></body>
</html>
