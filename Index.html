<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickers Shop</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: black;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 22px;
}

/* Cart icon */
.cart {
  position: fixed;
  top: 15px;
  right: 15px;
  background: red;
  color: white;
  padding: 10px;
  border-radius: 50%;
  cursor: pointer;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  padding: 15px;
}

.card {
  background: white;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

button {
  background: black;
  color: white;
  padding: 8px;
  border: none;
  margin-top: 5px;
  cursor: pointer;
}

/* Payment Section */
.payment {
  text-align: center;
  padding: 20px;
}

.qr {
  width: 200px;
}
</style>
</head>

<body>

<header>🔥 Stickers Shop</header>

<div class="cart">🛒</div>

<div class="products">

  <!-- Dragon Ball -->
  <div class="card">
    <img src="https://i.ibb.co/YFRpvLKc/adb89cf12dfbc6d449fcdc4aa385372c.jpg">
    <p>Goku Sticker</p>
    <button onclick="buy()">Buy</button>
  </div>

  <div class="card">
    <img src="https://ibb.co/4wV8pVph">
    <p>Vegeta Sticker</p>
    <button onclick="buy()">Buy</button>
  </div>

  <!-- Naruto -->
  <div class="card">
    <img src="https://i.imgur.com/6o5Vx6S.png">
    <p>Naruto Sticker</p>
    <button onclick="buy()">Buy</button>
  </div>

  <!-- Demon Slayer -->
  <div class="card">
    <img src="https://i.imgur.com/ZrXxK4n.png">
    <p>Tanjiro Sticker</p>
    <button onclick="buy()">Buy</button>
  </div>

  <!-- Solo Leveling -->
  <div class="card">
    <img src="https://i.imgur.com/1xK5K7F.png">
    <p>Sung Jin Woo</p>
    <button onclick="buy()">Buy</button>
  </div>

</div>

<div class="payment">
  <h2>💸 Payment</h2>

  <p>UPI ID: 9455104193@axl</p>

  <!-- QR Code -->
  <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9455104193@axl&pn=StickersShop">

  <br><br>

  <a href="upi://pay?pa=9455104193@axl&pn=StickersShop">
    <button>Pay Now</button>
  </a>

</div>

<script>
function buy() {
  alert("Order confirm karne ke liye UPI se payment karein");
}
</script>

</body>
</html>
